[package]
name = "thaw-inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Leaf crate: the Node-style `util.inspect` formatter. Plain Rust, no
# `#[no_mangle]` / extern symbols, so it can be compiled into more than one
# static archive (thaw-std, thaw-js) without symbol clashes.

[lib]
crate-type = ["rlib"]

[dependencies]

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
