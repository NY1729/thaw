[package]
name = "thaw-std"
version = "0.1.0"
edition.workspace = true

# Linked into compiled Thaw programs as a static archive by thaw-cli, same
# as thaw-arena/thaw-runtime -- not used as a normal Rust dependency.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1.0.151"
thaw-arena = { version = "0.1.0", path = "../thaw-arena" }
ureq = "3.4.0"

[dev-dependencies]
thaw-runtime = { version = "0.1.0", path = "../thaw-runtime" }
