[package]
name = "thaw-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
thaw-parser = { path = "../thaw-parser" }
thaw-js-infer = { path = "../thaw-js-infer" }
thaw-node-builtins = { path = "../thaw-node-builtins" }
# the same features thaw-cli enables: the build's feature scan (`scan_bundle_for_build`) must see `Intl` and `WebAssembly`
thaw-js = { path = "../thaw-js", features = ["intl", "wasm"] }
swc_ecma_visit = "29.0.0"
ureq = "3.4.0"

# tests of the node:zlib zstd natives (`cargo test -p thaw-registry --features zstd`): forwards to thaw-js.
[features]
zstd = ["thaw-js/zstd"]

[dev-dependencies]
brotli = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
libc = "0.2"
# tests only: the node:wasi preview1 natives (the registry tests run node:wasi through thaw-js); a normal-dependency feature would also change the thaw-js that thaw-cli ships
thaw-js = { path = "../thaw-js", features = ["wasi"] }
