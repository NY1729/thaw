[package]
name = "thaw-registry"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
thaw-parser = { path = "../thaw-parser" }
swc_ecma_visit = "29.0.0"
ureq = "3.4.0"

[dev-dependencies]
brotli = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thaw-quickjs = { path = "../thaw-quickjs" }
