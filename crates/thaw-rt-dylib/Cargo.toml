[package]
name = "thaw-rt-dylib"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Built as a staticlib; thaw-cli links it into `libthaw_rt.so.1` (see thaw_rt.map).
# `libthaw_rt.so`: the Thaw runtime (arena + runtime + std) as one shared
# object, so that several compiled Thaw programs and shared libraries can
# share one copy. Only this crate depends on all three runtime crates.
[lib]
crate-type = ["staticlib"]

[dependencies]
thaw-arena = { path = "../thaw-arena" }
thaw-jit = { path = "../thaw-jit" }
thaw-runtime = { path = "../thaw-runtime" }
thaw-std = { path = "../thaw-std" }
thaw-js = { path = "../thaw-js", optional = true }
thaw-intl = { path = "../thaw-intl", optional = true }

[build-dependencies]
sha2 = "0.10"

[features]
default = []
# One image with thaw-js too (`--shared-rt` for programs that use the JS engine): one arena, one TLS set.
thaw-js = ["dep:thaw-js"]
# The `intl` variant (`libthaw_rt_intl.so.1`): adds the thaw-intl natives and the baked CLDR data.
intl = ["dep:thaw-intl", "thaw-js?/intl"]
