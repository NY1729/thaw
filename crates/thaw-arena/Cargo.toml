[package]
name = "thaw-arena"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Compiled Thaw programs link this as a plain static archive (see
# thaw-cli), not as a normal Rust dependency -- there's no Rust code on the
# other side of the FFI boundary once codegen calls into it.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bumpalo = "3"
