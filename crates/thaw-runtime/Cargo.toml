[package]
name = "thaw-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Linked into compiled Thaw Lambda handlers as a static archive by thaw-cli,
# the same way thaw-arena is -- not used as a normal Rust dependency.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
ryu = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thaw-arena = { path = "../thaw-arena" }
webpki-roots = "1.0"
icu_normalizer = { version = "2.3.0", features = ["compiled_data"] }
regex = "1"
