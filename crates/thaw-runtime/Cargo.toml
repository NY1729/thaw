[package]
name = "thaw-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Linked into compiled Thaw Lambda handlers as a static archive by thaw-cli,
# the same way thaw-arena is -- not used as a normal Rust dependency.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
ryu = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thaw-arena = { path = "../thaw-arena" }
webpki-roots = "1.0"
icu_normalizer = { version = "2.3.0", features = ["compiled_data"] }
regex = "1"
# Backreferences and lookaround, which the `regex` crate deliberately lacks;
# used as a fallback so such patterns stay native instead of silently
# reporting "no match".
fancy-regex = "0.18"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Timezone database + civil-time arithmetic for the native Temporal
# `ZonedDateTime` support (thaw-quickjs uses the same crate for `Intl`).
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Non-ISO calendar systems for Temporal's `PlainDate`-family `calendarId`
# (`hebrew`, `japanese`, `islamic-*`, ...). jiff is ISO-only.
icu_calendar = "2.3.0"
