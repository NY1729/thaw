[package]
name = "thaw-js"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "EXPERIMENTAL Thaw-native JavaScript runtime (prototype of milestone M1; see designs/js-runtime)"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
intl = ["dep:thaw-intl"]
# WebAssembly natives (web/wasm.rs); `wasi` adds node:wasi preview1 support on top.
wasm = ["dep:thaw-wasm"]
wasi = ["wasm", "thaw-wasm/wasi"]
# node:sqlite natives (sqlite/); off by default, so programs without it link no SQLite.
sqlite = ["dep:thaw-sqlite"]
# node:zlib zstd natives (zlib/zstd.rs): C libzstd 1.5.7, the version Node 22 links, multithreaded (`zstdmt`, nbWorkers); off by default.
zstd = ["dep:zstd-safe", "zstd-safe/zstdmt"]

[dependencies]
thaw-intl = { path = "../thaw-intl", optional = true }
thaw-wasm = { path = "../thaw-wasm", optional = true }
thaw-sqlite = { path = "../thaw-sqlite", optional = true }
zstd-safe = { version = "8.3.0", default-features = false, features = ["std"], optional = true }
thaw-parser = { path = "../thaw-parser" }
thaw-node-builtins = { path = "../thaw-node-builtins" }
thaw-arena = { path = "../thaw-arena" }
swc_ecma_visit = "29.0.0"
swc_atoms = "10.0.0"
regress = "0.11.1"
num-bigint = "=0.4.8"
num-traits = "0.2"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
md-5 = { version = "0.10", features = ["oid"] }
scrypt = "0.11"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
ecdsa = "0.16"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core", "signature", "alloc"] }
ed448-goldilocks = { version = "=0.14.0-pre.15", default-features = false, features = ["std", "signing"] }
elliptic-curve = { version = "0.13", features = ["sec1", "pem", "arithmetic", "ecdh"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa", "pem", "ecdh"] }
p521 = { version = "0.13", features = ["ecdsa", "pem", "ecdh"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2", "pem", "getrandom"] }
sec1 = { version = "0.7", features = ["pem"] }
signature = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
pbkdf2 = "0.12"
libc = "0.2"
flate2 = { version = "1", features = ["zlib-rs"] }
brotli = "8"
httlib-huffman = "0.3.4"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
x509-parser = "0.18"
serde_json = "1"

[dev-dependencies]
thaw-hir = { path = "../thaw-hir" }
# Test-only, same device as thaw-napi: `thaw_tjs_dynamic_object_query` calls thaw-std's `thaw_json_parse` as an
# `extern "C"` resolved at the final link; the unit-test binary needs thaw-std (and the thaw-runtime helpers it calls)
# linked in. No normal dependency edge.
thaw-std = { path = "../thaw-std" }
thaw-runtime = { path = "../thaw-runtime" }
