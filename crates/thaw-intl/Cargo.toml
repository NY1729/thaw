[package]
name = "thaw-intl"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Native (AOT, no QuickJS) ECMA-402 subset: String.prototype.localeCompare,
# Number/Date toLocale*String. Linked into a compiled program only when the
# generated code calls a `thaw_intl_*` symbol (thaw-cli build.rs), because the
# baked CLDR data (thaw-icu-data) dwarfs the rest of the runtime. The icu4x
# primitives are `include!`d from thaw-quickjs so both hosts share one copy of
# the logic; the pins below must match thaw-quickjs's.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
thaw-arena = { path = "../thaw-arena" }
thaw-icu-data = { path = "../thaw-icu-data" }
fixed_decimal = { version = "=0.7.2", default-features = false }
icu_calendar = { version = "=2.3.0", default-features = false }
icu_collator = { version = "=2.3.1", default-features = false }
icu_datetime = { version = "=2.3.0", default-features = false }
icu_decimal = { version = "=2.3.0", default-features = false, features = ["unstable"] }
icu_experimental = { version = "=0.6.0", default-features = false }
icu_locale = { version = "=2.3.1", default-features = false }
icu_provider = { version = "=2.3.1", default-features = false }
icu_plurals = { version = "=2.3.0", default-features = false }
icu_time = { version = "=2.3.0", default-features = false }
writeable = "=0.6.4"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde_json = { version = "1", features = ["preserve_order"] }
