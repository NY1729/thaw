[package]
name = "thaw-icu-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Pure generated data (see src/lib.rs's header for the exact generation
# recipe). Every version below is pinned to match what crates/thaw-quickjs
# links against -- the baked data format is tied to the exact marker/type
# shapes of the icu4x version it was generated from.
[dependencies]
icu_calendar = { version = "=2.3.0", default-features = false }
icu_collator = { version = "=2.3.1", default-features = false }
icu_collections = { version = "=2.3.0", default-features = false }
icu_datetime = { version = "=2.3.0", default-features = false }
icu_decimal = { version = "=2.3.0", default-features = false }
icu_experimental = { version = "=0.6.0", default-features = false }
icu_list = { version = "=2.3.0", default-features = false }
icu_locale = { version = "=2.3.1", default-features = false }
icu_locale_core = { version = "=2.3.0", default-features = false }
icu_locale_fallback = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_pattern = { version = "=0.5.0", default-features = false }
icu_plurals = { version = "=2.3.0", default-features = false }
icu_provider = { version = "=2.3.1", default-features = false, features = ["baked"] }
icu_segmenter = { version = "=2.3.0", default-features = false }
icu_time = { version = "=2.3.0", default-features = false }
zerotrie = { version = "=0.2.5", default-features = false }
zerovec = { version = "=0.11.8", default-features = false }
