[package]
name = "thaw-quickjs"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["wasm"]
wasm = ["dep:wasmi", "dep:wasmi_wasi"]

[dependencies]
base64 = "0.22"
brotli = "8"
flate2 = "1"
getrandom = "0.2"
httlib-huffman = "0.3.4"
libc = "0.2"
rquickjs = "0.12.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
webpki-roots = "1.0"
wasmi = { version = "1.1.0", optional = true }
wasmi_wasi = { version = "1.1.0", optional = true }
x509-parser = "0.18"
