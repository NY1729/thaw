[package]
name = "thaw-quickjs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["brotli", "tls", "wasm"]
brotli = ["dep:brotli"]
tls = ["dep:rustls", "dep:webpki-roots", "dep:x509-parser"]
wasm = ["dep:wasmi", "dep:wasmi_wasi"]
# Real, curated-locale CLDR data for `Intl` (docs/design/intl-polyfill.md,
# "Real CLDR data via icu4x"). Off by default (unlike the three features
# above) because thaw-icu-data's baked dataset is the largest single
# dependency thaw-quickjs can pull in; `crates/thaw-cli/src/build.rs`'s
# `source_uses_intl` only turns it on for a program that actually
# references `Intl`.
intl = [
    "dep:thaw-icu-data",
    "dep:icu_calendar",
    "dep:icu_collator",
    "dep:icu_datetime",
    "dep:icu_decimal",
    "dep:icu_experimental",
    "dep:icu_list",
    "dep:icu_locale",
    "dep:icu_plurals",
    "dep:icu_provider",
    "dep:icu_segmenter",
    "dep:icu_time",
    "dep:writeable",
]
# Optional, default-off ICU4C backend for the few ECMA-402 behaviors
# ICU4X cannot express (`Intl.Collator`'s `usage: 'search'`). Selecting
# it makes the generated program link the system `libicui18n`/`libicuuc`
# dynamically, so it is opt-in via `thaw build --icu4c` and never part
# of the default/static build.
icu4c = ["intl"]

[dependencies]
thaw-arena = { path = "../thaw-arena" }
aes = "0.8"
base64 = "0.22"
brotli = { version = "8", optional = true }
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"
getrandom = "0.2"
httlib-huffman = "0.3.4"
ecdsa = "0.16"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core", "signature", "alloc"] }
ed448-goldilocks = { version = "=0.14.0-pre.15", default-features = false, features = [
    "std",
    "signing",
] }
elliptic-curve = { version = "0.13", features = ["sec1", "pem", "arithmetic", "ecdh"] }
icu_calendar = { version = "=2.3.0", default-features = false, optional = true }
icu_collator = { version = "=2.3.1", default-features = false, optional = true }
icu_datetime = { version = "=2.3.0", default-features = false, optional = true }
icu_decimal = { version = "=2.3.0", default-features = false, features = ["unstable"], optional = true }
icu_experimental = { version = "=0.6.0", default-features = false, optional = true }
icu_list = { version = "=2.3.0", default-features = false, optional = true }
icu_locale = { version = "=2.3.1", default-features = false, optional = true }
icu_plurals = { version = "=2.3.0", default-features = false, optional = true }
icu_provider = { version = "=2.3.1", default-features = false, optional = true }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["auto"], optional = true }
icu_time = { version = "=2.3.0", default-features = false, optional = true }
writeable = { version = "=0.6.4", optional = true }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pem", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa", "pem", "ecdh"] }
p521 = { version = "0.13", features = ["ecdsa", "pem", "ecdh"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rquickjs = "0.12.2"
url = "=2.5.8"
rsa = { version = "0.9", features = ["sha2", "pem", "getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sec1 = { version = "0.7", features = ["pem"] }
# `preserve_order` for this crate's own internal Rust/QuickJS JSON
# marshaling (key insertion order matters at that boundary too).
serde_json = { version = "1", features = ["preserve_order"] }
signature = "2"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
md-5 = "0.10"
des = "0.8"
scrypt = "0.11"
thaw-icu-data = { path = "../thaw-icu-data", optional = true }
webpki-roots = { version = "1.0", optional = true }
wasmi = { version = "1.1.0", optional = true }
wasmi_wasi = { version = "1.1.0", optional = true }
x509-parser = { version = "0.18", optional = true }

[dev-dependencies]
# Test-only: `thaw_js_dynamic_object_query` (api.rs) calls thaw-std's
# `thaw_json_parse` as an `extern "C"` declaration resolved at link time
# (no real Rust-level dependency between these archives, same reasoning
# as thaw-runtime's own `Cargo.toml` comment) -- this crate's own unit
# tests need thaw-std's rlib linked in to resolve that symbol. thaw-std
# in turn calls a couple of thaw-runtime helpers the same way, so
# thaw-runtime needs to come along too.
thaw-std = { path = "../thaw-std" }
thaw-runtime = { path = "../thaw-runtime" }
