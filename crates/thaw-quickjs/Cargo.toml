[package]
name = "thaw-quickjs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["brotli", "tls", "wasm"]
brotli = ["dep:brotli"]
tls = ["dep:rustls", "dep:webpki-roots", "dep:x509-parser"]
wasm = ["dep:wasmi", "dep:wasmi_wasi"]

[dependencies]
aes = "0.8"
base64 = "0.22"
brotli = { version = "8", optional = true }
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"
getrandom = "0.2"
httlib-huffman = "0.3.4"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pem"] }
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rquickjs = "0.12.2"
rsa = { version = "0.9", features = ["sha2", "pem", "getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sec1 = { version = "0.7", features = ["pem"] }
serde_json = "1"
signature = "2"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
scrypt = "0.11"
webpki-roots = { version = "1.0", optional = true }
wasmi = { version = "1.1.0", optional = true }
wasmi_wasi = { version = "1.1.0", optional = true }
x509-parser = { version = "0.18", optional = true }
