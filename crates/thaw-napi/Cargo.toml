[package]
name = "thaw-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["quickjs-brotli", "quickjs-tls", "quickjs-wasm"]
quickjs = ["dep:thaw-quickjs"]
quickjs-brotli = ["quickjs", "thaw-quickjs/brotli"]
quickjs-tls = ["quickjs", "thaw-quickjs/tls"]
quickjs-wasm = ["quickjs", "thaw-quickjs/wasm"]

[dependencies]
base64 = "0.22"
flate2 = "1"
libc = "0.2"
serde_json = "1"
tempfile = "3"
thaw-quickjs = { path = "../thaw-quickjs", optional = true, default-features = false }
