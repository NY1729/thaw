[package]
name = "thaw-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["quickjs-brotli", "quickjs-tls", "quickjs-wasm"]
js-engine = ["dep:thaw-quickjs"]
quickjs = ["js-engine"]
quickjs-brotli = ["js-engine", "thaw-quickjs/brotli"]
quickjs-tls = ["js-engine", "thaw-quickjs/tls"]
quickjs-wasm = ["js-engine", "thaw-quickjs/wasm"]
quickjs-intl = ["js-engine", "thaw-quickjs/intl"]
quickjs-icu4c = ["js-engine", "thaw-quickjs/icu4c"]

[dependencies]
thaw-arena = { path = "../thaw-arena" }
base64 = "0.22"
flate2 = "1"
libc = "0.2"
serde_json = "1"
tempfile = "3"
thaw-quickjs = { path = "../thaw-quickjs", optional = true, default-features = false }

[dev-dependencies]
# Test-only: with the `js-engine` feature (on by default), this crate
# transitively needs thaw-quickjs's `thaw_js_dynamic_object_query`, which
# calls thaw-std's `thaw_json_parse` as an `extern "C"` declaration
# resolved at link time (no real Rust-level dependency between these
# archives -- see thaw-runtime's own `Cargo.toml` comment) -- this
# crate's own unit tests need thaw-std's rlib linked in to resolve it.
# thaw-std in turn calls a couple of thaw-runtime helpers the same way
# (`thaw_date_to_iso_string`/`thaw_string_to_number`/the `fetch`/`http`
# event-loop hooks), so thaw-runtime needs to come along too.
thaw-std = { path = "../thaw-std" }
thaw-runtime = { path = "../thaw-runtime" }
