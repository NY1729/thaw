[package]
name = "thaw-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "thaw"
path = "src/main.rs"

[dependencies]
flate2 = "1"
sha2 = "0.10"
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
thaw-bridge = { version = "0.1.0", path = "../thaw-bridge" }
thaw-hir = { version = "0.1.0", path = "../thaw-hir" }
thaw-llvm = { version = "0.1.0", path = "../thaw-llvm" }
thaw-parser = { version = "0.1.0", path = "../thaw-parser" }
thaw-registry = { version = "0.1.0", path = "../thaw-registry" }
swc_ecma_visit = "29.0.0"
serde_json = "1"
# `intl`: the eligibility scan must see the same `Intl` global a program built with the feature runs on.
thaw-js = { version = "0.1.0", path = "../thaw-js", features = ["intl"] }
thaw-js-infer = { version = "0.1.0", path = "../thaw-js-infer" }
semver = "1"

[dev-dependencies]
# Loopback TLS server for the hermetic HTTPS test (same provider as thaw-quickjs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
# Opt-in diagnostics (with THAW_JS_RUNTIME=1): scan each registry bundle with the experimental thaw-js
# evaluator and record which packages it could run instead of QuickJS in the artifact manifest.
thaw-js-diagnostics = []
