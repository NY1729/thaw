name: diag-q9-535-ky

# One-off diagnostic (q9 / #535): runs the real-ky HTTP/HTTPS registry test three ways
# (default engine, thaw-js routing debug, QuickJS opt-out) and uploads the logs.
on:
  push:
    branches:
      - feat/q9-thaw-js-bytes-result-async-hooks
    paths:
      - .github/workflows/diag-q9-535-ky.yml

permissions:
  contents: read

jobs:
  diag:
    name: real-ky registry test, default vs debug vs quickjs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      THAW_RUN_NPM_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            if [ "$attempt" = 1 ]; then
              # fallback: the default Ubuntu archive is unreachable, use a mirror for noble
              sudo rm -f /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list
              printf 'Types: deb\nURIs: http://archive.ubuntulinux.jp/ubuntu/\nSuites: noble\nComponents: main universe\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/ubuntu-fallback.sources >/dev/null
            fi
            sleep 10
          done
          exit 1
      - name: Cache runtime static libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          key: thaw-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-parser/**', 'crates/thaw-quickjs/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            thaw-runtime-${{ runner.os }}-
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('crates/thaw-cli/src/tests/**') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Prebuild test binary
        run: cargo test -p thaw-cli --no-run
      - name: Run real-ky test under three configurations
        run: |
          OUT="$RUNNER_TEMP/diag-q9-535"
          mkdir -p "$OUT"
          T=tests::registry_add_fetches_over_http_and_https_with_real_ky_when_enabled
          # Substring filter (no --exact): the name is unique, and this avoids
          # guessing the module path. Each run's stderr is kept in its own log.
          # `|| true` so all three runs happen even if one fails.
          echo "== A: default env" | tee "$OUT/summary.txt"
          timeout 600 cargo test -p thaw-cli registry_add_fetches_over_http_and_https_with_real_ky_when_enabled -- --test-threads=1 --nocapture > "$OUT/A-default.log" 2>&1 || true
          echo "== B: THAW_JS_RUNTIME_DEBUG=1" | tee -a "$OUT/summary.txt"
          THAW_JS_RUNTIME_DEBUG=1 timeout 600 cargo test -p thaw-cli registry_add_fetches_over_http_and_https_with_real_ky_when_enabled -- --test-threads=1 --nocapture > "$OUT/B-debug.log" 2>&1 || true
          echo "== C: THAW_JS_ENGINE=quickjs" | tee -a "$OUT/summary.txt"
          THAW_JS_ENGINE=quickjs timeout 600 cargo test -p thaw-cli registry_add_fetches_over_http_and_https_with_real_ky_when_enabled -- --test-threads=1 --nocapture > "$OUT/C-quickjs.log" 2>&1 || true

          for f in A-default B-debug C-quickjs; do
            {
              echo "===== $f: result lines"
              grep -E '^test |test result:|panicked|error(\[|:)' "$OUT/$f.log" | tail -n 20 || true
            } | tee -a "$OUT/summary.txt"
          done

          echo "===== B-debug: routing lines (route|eligible|reject|quickjs|thaw-js)" | tee -a "$OUT/summary.txt"
          grep -iE 'route|eligible|reject|quickjs|thaw-js' "$OUT/B-debug.log" > "$OUT/B-routing-lines.txt" || true
          cat "$OUT/B-routing-lines.txt" | tee -a "$OUT/summary.txt" || true
          echo "===== B-debug: last 60 lines" | tee -a "$OUT/summary.txt"
          tail -n 60 "$OUT/B-debug.log" | tee -a "$OUT/summary.txt" || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-q9-535-ky
          path: ${{ runner.temp }}/diag-q9-535
          if-no-files-found: warn
