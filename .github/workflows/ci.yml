  node-compat-thaw-js:
    # Non-gating measurement of the thaw-js runtime against the node-compat manifest (see
    # designs/plan-tj23-user-dynamic-default.md, stage 0). Runs only for a pull request that
    # carries the `thaw-js-measure` label when it is opened or synchronized, or on workflow_dispatch.
    # Not triggered by the `labeled` event: adding `labeled` to pull_request would start every
    # job above too, since none of them filters on it.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'thaw-js-measure')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: runtime-only
          # The same run with the closure compiler on, to compare against runtime-only (decides the default flip).
          - mode: runtime-only-compile-on
            compile: "on"
          # Coroutine backend leg: same run with THAW_JS_CO=thread (the default leg is the costack backend).
          - mode: runtime-only-thread
            co: "thread"
    name: node-compat thaw-js (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Free disk space
        run: |
          # in the background: the removal took ~1.7 min and nothing needs the space until the build
          (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift >/dev/null 2>&1 &)
          df -h /
      - name: Install system dependencies
        run: |
