        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Test ${{ matrix.crate }} (shard ${{ matrix.shard }} of 4)
        env:
          CRATE: ${{ matrix.crate }}
          SHARD: ${{ matrix.shard }}
          # thaw-llvm tests are single-thread CPU bound (load ~1.2 on 4 vCPUs).
          # thaw-cli stays at 1 until the vmstat artifact shows >6 GB headroom.
          TEST_THREADS: ${{ matrix.crate == 'thaw-llvm' && '2' || '1' }}
        run: |
          # The whole test binary used to run in one job (about half an hour for
          # thaw-llvm alone). Each shard builds the binary once and runs its own
          # quarter of the tests in one process, so cross-test interference inside
          # a process is still exercised.
          listing=$(cargo test -p "$CRATE" -- --list) || exit 1
          mapfile -t tests < <(sed -n 's/: test$//p' <<< "$listing")
          if (( ${#tests[@]} == 0 )); then
            echo "No $CRATE tests were listed" >&2
            exit 1
          fi
          selected=()
          for index in "${!tests[@]}"; do
            if (( index % 4 == SHARD )); then
              selected+=("${tests[$index]}")
            fi
          done
          echo "Running ${#selected[@]} of ${#tests[@]} $CRATE tests"
          cargo test -p "$CRATE" -- --exact --test-threads="$TEST_THREADS" "${selected[@]}"
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          pkill -x vmstat || true
          {
            echo "== free -h"; free -h
            echo "== df -h /"; df -h /
            echo "== uptime"; uptime
            echo "== dmesg (last 100 lines)"; (sudo dmesg -T 2>&1 || true) | tail -n 100
            echo "== ps (top 25 by RSS)"; ps aux --sort=-rss | head -n 25
          } > "$diagnostics/summary.txt" 2>&1 || true
          cat "$diagnostics/summary.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

  npm-integration:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # Observed shards took 15-39 minutes under the old index-modulo split. The
    # split is now weighted by .github/npm-shard-weights.txt (expected ~18 min
    # max). A single lost shard ran 53 minutes with no log before this cap existed.
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      THAW_RUN_NPM_INTEGRATION: "1"
      THAW_SOAK_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /
      - name: Start vmstat logger
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          nohup vmstat -t 10 > "$RUNNER_TEMP/diagnostics/vmstat.log" 2>&1 < /dev/null &
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - name: Cache runtime static libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          # The first key component mirrors thaw-cli/build.rs's runtime fingerprint,
          # so an unchanged runtime reuses the archives and any other change still
          # starts from the newest compatible cache through restore-keys.
          key: thaw-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-parser/**', 'crates/thaw-quickjs/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            thaw-runtime-${{ runner.os }}-
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('crates/thaw-cli/src/tests/**') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Test real web applications and packages (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Each test gets its own 20-minute cap (the job cap bounds the whole
          # shard). Two tests run at a time (xargs -P2). Each test writes its
          # own log under diagnostics, and the combined output is kept in
          # test-output.log, so a lost or killed shard still leaves its logs.
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/diagnostics"
          listing=$(cargo test -p thaw-cli registry_add -- --list) || exit 1
          mapfile -t tests < <(sed -n 's/: test$//p' <<< "$listing")
          if (( ${#tests[@]} == 0 )); then
            echo 'No registry tests were listed' >&2
            exit 1
          fi
          # Duration-weighted assignment: every shard computes the same greedy
          # longest-first split, so no list has to be kept in sync by hand.
          tests+=(tests::node_http_matches_real_node_under_fifty_concurrent_keep_alive_connections_when_enabled)
          declare -A weight
          while read -r sec name; do weight[$name]=$sec; done < .github/npm-shard-weights.txt
          shards=4   # must equal the matrix length
          if (( SHARD >= shards )); then
            echo "Shard $SHARD is outside the $shards-shard split; update the matrix and shards together" >&2
            exit 1
          fi
          loads=(); for ((i = 0; i < shards; i++)); do loads+=(0); done
          mine=()
          while read -r wt t; do
            best=0
            for ((i = 1; i < shards; i++)); do
              if (( loads[i] < loads[best] )); then best=$i; fi
            done
            loads[best]=$(( loads[best] + wt ))
            if (( best == SHARD )); then mine+=("$t"); fi
          done < <(for t in "${tests[@]}"; do
                     [[ "$t" == *postgres* ]] && continue
                     echo "${weight[$t]:-5} $t"
                   done | LC_ALL=C sort -k1,1nr -k2,2)
          if (( ${#mine[@]} == 0 )); then
            echo "Shard $SHARD has no tests" >&2
            exit 1
          fi
          # Prebuild once so the two workers do not race on the cargo build.
          cargo test -p thaw-cli --no-run
          run_one() {
            local t="$1" log rc
            log="$RUNNER_TEMP/diagnostics/test-$$-${t//::/_}.log"
            set +e
            timeout --kill-after=30s 20m cargo test -p thaw-cli "$t" -- --exact --test-threads=1 --nocapture > "$log" 2>&1
            rc=$?
            set -e
            { echo "::group::$t (rc=$rc)"; cat "$log"; echo "::endgroup::"; } | tee -a "$RUNNER_TEMP/diagnostics/test-output.log"
            return "$rc"
          }
          export -f run_one
          # xargs exits 123 if any invocation failed; every test still runs.
          printf '%s\n' "${mine[@]}" | xargs -P2 -I{} bash -c 'run_one "$1"' _ {}
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          pkill -x vmstat || true
          {
            echo "== free -h"; free -h
            echo "== df -h /"; df -h /
            echo "== uptime"; uptime
            echo "== dmesg (last 100 lines)"; (sudo dmesg -T 2>&1 || true) | tail -n 100
            echo "== ps (top 25 by RSS)"; ps aux --sort=-rss | head -n 25
          } > "$diagnostics/summary.txt" 2>&1 || true
          cat "$diagnostics/summary.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

  runtime-comparison:
    strategy:
      matrix:
