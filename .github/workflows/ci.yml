name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THAW_ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/target/acceptance
      LLVM_SYS_220_PREFIX: /opt/llvm-22
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Install LLVM 22
        run: |
          curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz -o /tmp/llvm.tar.xz
          echo "df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384  /tmp/llvm.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/llvm-22
          sudo tar -xJf /tmp/llvm.tar.xz -C /opt/llvm-22 --strip-components=1
          rm /tmp/llvm.tar.xz
          echo /opt/llvm-22/bin >> "$GITHUB_PATH"
          echo LD_LIBRARY_PATH=/opt/llvm-22/lib >> "$GITHUB_ENV"
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clean
      - name: Run tests
        run: |
          cargo run -p thaw-cli -- compat tests/typescript-compat.json
          find target -mindepth 1 -maxdepth 1 -type d -name 'thaw-*' -exec rm -rf -- {} +
          cargo run -p thaw-cli -- node-compat tests/typescript-runtime-compat.json
          find target -mindepth 1 -maxdepth 1 -type d -name 'thaw-*' -exec rm -rf -- {} +
          cargo run -p thaw-cli -- node-compat tests/node-compat.json
          find target -mindepth 1 -maxdepth 1 -type d -name 'thaw-*' -exec rm -rf -- {} +
          cargo clean
          cargo test --workspace --exclude thaw-cli --exclude thaw-llvm --exclude thaw-registry
          cargo test -p thaw-registry -- --test-threads=1
          cargo test -p thaw-llvm -- --test-threads=1
          cargo test -p thaw-cli -- --test-threads=1
      - name: Install Prisma example
        run: npm ci --prefix examples/hono-react-prisma-board
      - name: Test real web applications and packages
        env:
          THAW_RUN_NPM_INTEGRATION: "1"
        run: |
          cargo test -p thaw-cli registry_add_runs_a_real_hono_route_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_runs_a_real_fastify_route_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_runs_a_real_express_route_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_builds_a_multi_package_project_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_builds_and_runs_date_fns_root_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_infers_a_real_commander_action_callback_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_processes_a_real_hono_sharp_image_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_runs_real_safe_buffer_string_conversions_when_enabled -- --nocapture
      - name: Test Socket.IO client and server
        env:
          THAW_RUN_NPM_INTEGRATION: "1"
        run: cargo test -p thaw-cli registry_add_runs_real_socket_io_client_ack_and_disconnect_when_enabled -- --nocapture
      - name: Test Hono, Prisma, and PostgreSQL
        env:
          THAW_POSTGRES_URL: postgresql://postgres:password@127.0.0.1:5432/app
        run: |
          cargo test -p thaw-cli builds_and_serves_hono_react_prisma_postgres_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_queries_postgres_with_real_pg_when_enabled -- --nocapture
      - name: Upload acceptance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-metrics
          path: target/acceptance/*.json
          if-no-files-found: ignore

  runtime-comparison:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            llvm_asset: LLVM-22.1.8-Linux-X64.tar.xz
            llvm_sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
            architecture: x64
          - runner: ubuntu-24.04-arm
            llvm_asset: LLVM-22.1.8-Linux-ARM64.tar.xz
            llvm_sha256: 805efad2bb91cb4967fa569e0881d10c0f69c04461cf671cccbae19f547acc34
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      LLVM_SYS_220_PREFIX: /opt/llvm-22
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev time
      - name: Install LLVM 22
        env:
          LLVM_ASSET: ${{ matrix.llvm_asset }}
          LLVM_SHA256: ${{ matrix.llvm_sha256 }}
        run: |
          curl -L "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET" -o /tmp/llvm.tar.xz
          echo "$LLVM_SHA256  /tmp/llvm.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/llvm-22
          sudo tar -xJf /tmp/llvm.tar.xz -C /opt/llvm-22 --strip-components=1
          echo /opt/llvm-22/bin >> "$GITHUB_PATH"
          echo LD_LIBRARY_PATH=/opt/llvm-22/lib >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Compare Node, Bun, and Thaw
        run: |
          cargo build --release -p thaw-cli
          benchmarks/runtime/run.sh target/release/thaw "runtime-${{ matrix.architecture }}.json"
      - name: Check for a startup time / RSS regression
        run: |
          benchmarks/runtime/check_regression.sh \
            "runtime-${{ matrix.architecture }}.json" \
            "benchmarks/runtime/baseline-${{ matrix.architecture }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.architecture }}
          path: runtime-${{ matrix.architecture }}.json
