      # the compile env applied after the prelude (fix #689) and run in about a minute; any engine change that makes
      # the AST and the compiled path disagree fails here.
      - name: thaw-js compile tests with compiled functions
        env:
          THAW_JS_COMPILE: "on"
          THAW_JS_COMPILE_AFTER: "1"
        run: 'cargo test -p thaw-js --lib compile::'
      - name: thaw-js compile tests in compile check mode
        env:
          THAW_JS_COMPILE: "check"
          THAW_JS_COMPILE_AFTER: "1"
        run: 'cargo test -p thaw-js --lib compile::'
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          pkill -x vmstat || true
          {
            echo "== free -h"; free -h
            echo "== df -h /"; df -h /
            echo "== uptime"; uptime
            echo "== dmesg (last 100 lines)"; (sudo dmesg -T 2>&1 || true) | tail -n 100
            echo "== ps (top 25 by RSS)"; ps aux --sort=-rss | head -n 25
          } > "$diagnostics/summary.txt" 2>&1 || true
          cat "$diagnostics/summary.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

