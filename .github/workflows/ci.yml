name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Observed runs take 55-75 minutes; a hang fails with its logs instead of
    # running for the 6-hour default.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THAW_ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/target/acceptance
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Start vmstat logger
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          nohup vmstat -t 10 > "$RUNNER_TEMP/diagnostics/vmstat.log" 2>&1 < /dev/null &
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - name: Cache runtime static libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          # The first key component mirrors thaw-cli/build.rs's runtime fingerprint,
          # so an unchanged runtime reuses the archives and any other change still
          # starts from the newest compatible cache through restore-keys.
          key: thaw-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-parser/**', 'crates/thaw-quickjs/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            thaw-runtime-${{ runner.os }}-
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clean
      - name: Run tests
        run: |
          cargo run -p thaw-cli -- compat tests/typescript-compat.json
          find target -mindepth 1 -maxdepth 1 -type d -name 'thaw-*' -exec rm -rf -- {} +
          cargo run -p thaw-cli -- node-compat tests/typescript-runtime-compat.json
          find target -mindepth 1 -maxdepth 1 -type d -name 'thaw-*' -exec rm -rf -- {} +
          cargo run -p thaw-cli -- node-compat tests/node-compat.json
          find target -mindepth 1 -maxdepth 1 -type d -name 'thaw-*' -exec rm -rf -- {} +
          for manifest in builtins path-contracts process-credentials text-encoding-contracts; do
            cargo run -p thaw-cli -- node-compat tests/$manifest-compat.json
            find target -mindepth 1 -maxdepth 1 -type d -name 'thaw-*' -exec rm -rf -- {} +
          done
          cargo clean
          cargo test --workspace --exclude thaw-cli --exclude thaw-llvm --exclude thaw-registry
          cargo test -p thaw-registry -- --test-threads=1
      - name: Install Prisma example
        run: npm ci --prefix examples/hono-react-prisma-board
      - name: Test Hono, Prisma, and PostgreSQL
        env:
          THAW_POSTGRES_URL: postgresql://postgres:password@127.0.0.1:5432/app
        run: |
          cargo test -p thaw-cli builds_and_serves_hono_react_prisma_postgres_when_enabled -- --nocapture
          cargo test -p thaw-cli registry_add_queries_postgres_with_real_pg_when_enabled -- --nocapture
      - name: Upload acceptance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-metrics
          path: target/acceptance/*.json
          if-no-files-found: ignore
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          pkill -x vmstat || true
          {
            echo "== free -h"; free -h
            echo "== df -h /"; df -h /
            echo "== uptime"; uptime
            echo "== dmesg (last 100 lines)"; (sudo dmesg -T 2>&1 || true) | tail -n 100
            echo "== ps (top 25 by RSS)"; ps aux --sort=-rss | head -n 25
          } > "$diagnostics/summary.txt" 2>&1 || true
          cat "$diagnostics/summary.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        crate: [thaw-llvm, thaw-cli]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # Observed shards take 15-26 minutes.
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Start vmstat logger
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          nohup vmstat -t 10 > "$RUNNER_TEMP/diagnostics/vmstat.log" 2>&1 < /dev/null &
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - name: Cache runtime static libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          # The first key component mirrors thaw-cli/build.rs's runtime fingerprint,
          # so an unchanged runtime reuses the archives and any other change still
          # starts from the newest compatible cache through restore-keys.
          key: thaw-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-parser/**', 'crates/thaw-quickjs/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            thaw-runtime-${{ runner.os }}-
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Test ${{ matrix.crate }} (shard ${{ matrix.shard }} of 4)
        env:
          CRATE: ${{ matrix.crate }}
          SHARD: ${{ matrix.shard }}
        run: |
          # The whole test binary used to run in one job (about half an hour for
          # thaw-llvm alone). Each shard builds the binary once and runs its own
          # quarter of the tests in one process, so cross-test interference inside
          # a process is still exercised.
          listing=$(cargo test -p "$CRATE" -- --list) || exit 1
          mapfile -t tests < <(sed -n 's/: test$//p' <<< "$listing")
          if (( ${#tests[@]} == 0 )); then
            echo "No $CRATE tests were listed" >&2
            exit 1
          fi
          selected=()
          for index in "${!tests[@]}"; do
            if (( index % 4 == SHARD )); then
              selected+=("${tests[$index]}")
            fi
          done
          echo "Running ${#selected[@]} of ${#tests[@]} $CRATE tests"
          cargo test -p "$CRATE" -- --exact --test-threads=1 "${selected[@]}"
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          pkill -x vmstat || true
          {
            echo "== free -h"; free -h
            echo "== df -h /"; df -h /
            echo "== uptime"; uptime
            echo "== dmesg (last 100 lines)"; (sudo dmesg -T 2>&1 || true) | tail -n 100
            echo "== ps (top 25 by RSS)"; ps aux --sort=-rss | head -n 25
          } > "$diagnostics/summary.txt" 2>&1 || true
          cat "$diagnostics/summary.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

  npm-integration:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # Observed shards take 15-39 minutes. A single lost shard ran 53 minutes
    # with no log before this cap existed.
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      THAW_RUN_NPM_INTEGRATION: "1"
      THAW_SOAK_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - name: Start vmstat logger
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          nohup vmstat -t 10 > "$RUNNER_TEMP/diagnostics/vmstat.log" 2>&1 < /dev/null &
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - name: Cache runtime static libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          # The first key component mirrors thaw-cli/build.rs's runtime fingerprint,
          # so an unchanged runtime reuses the archives and any other change still
          # starts from the newest compatible cache through restore-keys.
          key: thaw-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-parser/**', 'crates/thaw-quickjs/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            thaw-runtime-${{ runner.os }}-
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('crates/thaw-cli/src/tests/**') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Test real web applications and packages (shard ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Each test gets its own 20-minute cap (the job cap bounds the whole
          # shard). Output is also kept in the diagnostics folder, so a lost
          # or killed shard still leaves its log behind.
          set -o pipefail
          listing=$(cargo test -p thaw-cli registry_add -- --list) || exit 1
          mapfile -t tests < <(sed -n 's/: test$//p' <<< "$listing")
          if (( ${#tests[@]} == 0 )); then
            echo 'No registry tests were listed' >&2
            exit 1
          fi
          index=0
          for test in "${tests[@]}"; do
            if [[ "$test" != *postgres* ]] && (( index % 4 == SHARD )); then
              timeout --kill-after=30s 20m cargo test -p thaw-cli "$test" -- --exact --test-threads=1 --nocapture 2>&1 |
                tee -a "$RUNNER_TEMP/diagnostics/test-output.log"
            fi
            index=$((index + 1))
          done
          if (( SHARD == 0 )); then
            timeout --kill-after=30s 20m cargo test -p thaw-cli tests::node_http_matches_real_node_under_fifty_concurrent_keep_alive_connections_when_enabled -- --exact --nocapture 2>&1 |
              tee -a "$RUNNER_TEMP/diagnostics/test-output.log"
          fi
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          pkill -x vmstat || true
          {
            echo "== free -h"; free -h
            echo "== df -h /"; df -h /
            echo "== uptime"; uptime
            echo "== dmesg (last 100 lines)"; (sudo dmesg -T 2>&1 || true) | tail -n 100
            echo "== ps (top 25 by RSS)"; ps aux --sort=-rss | head -n 25
          } > "$diagnostics/summary.txt" 2>&1 || true
          cat "$diagnostics/summary.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore

  runtime-comparison:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            llvm_asset: LLVM-22.1.8-Linux-X64.tar.xz
            llvm_sha256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
            architecture: x64
          - runner: ubuntu-24.04-arm
            llvm_asset: LLVM-22.1.8-Linux-ARM64.tar.xz
            llvm_sha256: 805efad2bb91cb4967fa569e0881d10c0f69c04461cf671cccbae19f547acc34
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    # Observed runs take 14-17 minutes.
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Start vmstat logger
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          nohup vmstat -t 10 > "$RUNNER_TEMP/diagnostics/vmstat.log" 2>&1 < /dev/null &
      - name: Install system dependencies
