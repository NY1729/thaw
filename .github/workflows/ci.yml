          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev time; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-${{ runner.arch }}-${{ matrix.llvm_sha256 }}
      - name: Install LLVM 22
        env:
          LLVM_ASSET: ${{ matrix.llvm_asset }}
          LLVM_SHA256: ${{ matrix.llvm_sha256 }}
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Compare Node, Bun, and Thaw
        run: |
          cargo build --release -p thaw-cli
          benchmarks/runtime/run.sh target/release/thaw "runtime-${{ matrix.architecture }}.json"
      - name: Check for a startup time / RSS regression
        run: |
          benchmarks/runtime/check_regression.sh \
            "runtime-${{ matrix.architecture }}.json" \
            "benchmarks/runtime/baseline-${{ matrix.architecture }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.architecture }}
          path: runtime-${{ matrix.architecture }}.json
      - name: Collect diagnostics
        if: always()
        run: |
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          pkill -x vmstat || true
          {
            echo "== free -h"; free -h
            echo "== df -h /"; df -h /
            echo "== uptime"; uptime
            echo "== dmesg (last 100 lines)"; (sudo dmesg -T 2>&1 || true) | tail -n 100
            echo "== ps (top 25 by RSS)"; ps aux --sort=-rss | head -n 25
          } > "$diagnostics/summary.txt" 2>&1 || true
          cat "$diagnostics/summary.txt"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: ignore
