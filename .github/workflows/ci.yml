            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          # The first key component mirrors thaw-cli/build.rs's runtime fingerprint,
          # so an unchanged runtime reuses the archives and any other change still
          # starts from the newest compatible cache through restore-keys.
          key: thaw-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-parser/**', 'crates/thaw-quickjs/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            thaw-runtime-${{ runner.os }}-
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Run node-compat with thaw-js (${{ matrix.mode }})
        env:
          THAW_JS_RUNTIME: "1"
          THAW_JS_USER_DYNAMIC: ${{ matrix.dynamic }}
          THAW_NODE_COMPAT_JOBS: "4"
          # TEMPORARY (PR diagnostics): remove after reading stderr.log (THAW_JS_RUNTIME_DEBUG prints callback param types and mask at compile time)
          THAW_JS_RUNTIME_DEBUG: "1"
        run: |
          set +e
          cargo run -p thaw-cli -- node-compat tests/node-compat.json > "$RUNNER_TEMP/report.json" 2> "$RUNNER_TEMP/stderr.log"
          status=$?
          echo "$status" > "$RUNNER_TEMP/exit-status"
          tail -n 5 "$RUNNER_TEMP/stderr.log"
          exit "$status"
      - name: Summarize thaw-js node-compat
        if: always()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          report="$RUNNER_TEMP/report.json"
          status=$(cat "$RUNNER_TEMP/exit-status" 2>/dev/null || echo not-run)
          jq -r '.cases[] | select(.source | test("new Function|eval\\(")) | .name' tests/node-compat.json > "$RUNNER_TEMP/dynamic-names.txt"
          {
            echo "### thaw-js node-compat: $MODE (exit $status)"
            if jq -e '.results' "$report" > /dev/null 2>&1; then
              jq -r '"total \(.total), bugs \(.bugs), referenceErrors \(.referenceErrors)"' "$report"
              echo
              echo "Failing cases (classification other than matched):"
              jq -r '.results[] | select(.classification != "matched") | "- \(.name): \(.classification) \((.detail // "") | .[0:200] | gsub("\n"; " "))"' "$report"
              echo
              echo "Cases using new Function or eval (the user-dynamic set):"
              jq -r --rawfile names "$RUNNER_TEMP/dynamic-names.txt" '($names | split("\n") | map(select(length > 0))) as $dyn | .results[] | select(.name as $n | any($dyn[]; . == $n)) | "- \(.name): \(.classification)"' "$report"
            else
              echo "No JSON report was produced; see the stderr.log artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload thaw-js node-compat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thaw-js-node-compat-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/stderr.log
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    # Observed runs take 55-75 minutes; a hang fails with its logs instead of
    # running for the 6-hour default.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THAW_ACCEPTANCE_OUTPUT_DIR: ${{ github.workspace }}/target/acceptance
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
