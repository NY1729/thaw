          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Run compat manifests (${{ matrix.group }})
        env:
          MANIFESTS: ${{ matrix.manifests }}
          GROUP: ${{ matrix.group }}
          # runners have 4 vCPU; the default is cores/2 = 2 workers
          THAW_NODE_COMPAT_JOBS: "4"
        run: |
          if [[ "$GROUP" == others ]]; then
            cargo run -p thaw-cli -- compat tests/typescript-compat.json
          fi
          for m in $MANIFESTS; do
            cargo run -p thaw-cli -- node-compat "tests/$m.json"
          done
      - name: Collect diagnostics
