name: pkg-size

# Non-gating measurement of what an imported npm package costs: per corpus package, an import-only program's exe
# size, build wall time, cold start and max RSS (tools/pkg-size). Nothing here fails a build or belongs in a
# required-checks list: read the step summary. Runs on demand, or on a pull request that carries the
# `thaw-js-measure` label. The job skeleton, toolchain and cache steps follow jit-coverage.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      only:
        description: one corpus package name (empty = all 24)
        default: ""

permissions:
  contents: read

concurrency:
  group: pkg-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pkg-size:
    name: Import-only exe size, build time, start-up and RSS per corpus package
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'thaw-js-measure')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `thaw add` runs npm.
          node-version: "22"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update || echo "apt-get update reported an error (a broken mirror?), trying the install with the cached package lists" >&2;
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev time; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-${{ runner.arch }}-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Cache cargo registry and release build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          key: jsengine-corpus-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-node-builtins/**', 'crates/thaw-parser/**', 'crates/thaw-intl/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            jsengine-corpus-${{ runner.os }}-
      - name: Build thaw CLI (release)
        run: |
          cargo build --release -p thaw-cli
      - name: Measure import-only programs
        env:
          THAW: ${{ github.workspace }}/target/release/thaw
          SCRATCH: ${{ runner.temp }}/pkg-size-scratch
        run: |
          mkdir -p "$RUNNER_TEMP/pkg-size-out"
          bash tools/pkg-size/measure.sh -o "$RUNNER_TEMP/pkg-size-out/pkg-size.tsv" ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Print summary and delta against the committed baseline
        if: always()
        run: |
          out="$RUNNER_TEMP/pkg-size-out/pkg-size.tsv"
          {
            echo '### pkg-size (this run)'
            echo '```'; column -t -s$'\t' "$out" 2>/dev/null; echo '```'
            echo '### committed baseline (tools/pkg-size/baseline.tsv)'
            echo '```'; column -t -s$'\t' tools/pkg-size/baseline.tsv; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg-size-tsv
          path: ${{ runner.temp }}/pkg-size-out
          if-no-files-found: ignore
