name: parity-routed

# Non-gating H2 check (plan-q9-systematic-parity.md section 3): one generated probe matrix
# (tools/parity/gen_routed.py) compiled by thaw twice, once with THAW_JS_ROUTE_ALL=1 (thaw-js) and once
# with THAW_JS_ENGINE=quickjs (QuickJS), run, and both diffed against node (the oracle) with
# tools/parity/diff.py. tools/parity/threeway.py then classifies node vs quickjs vs thaw-js per probe.
# Records gaps only; never fails the PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/parity/**"
      - ".github/workflows/parity-routed.yml"

permissions:
  contents: read

concurrency:
  group: parity-routed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  routed:
    name: parity routed matrix (thaw-js route-all and quickjs vs node, non-gating)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h /
      - name: Install system dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
               sudo timeout 600 apt-get -o Acquire::Retries=3 install -y libuv1-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            if [ "$attempt" = 1 ]; then
              # fallback: the default Ubuntu archive is unreachable, use a mirror for noble
              sudo rm -f /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list
              printf 'Types: deb\nURIs: http://archive.ubuntulinux.jp/ubuntu/\nSuites: noble\nComponents: main universe\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/ubuntu-fallback.sources >/dev/null
            fi
            sleep 10
          done
          exit 1
      - name: Cache runtime static libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/thaw-*
          key: thaw-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/thaw-arena/**', 'crates/thaw-icu-data/**', 'crates/thaw-runtime/**', 'crates/thaw-std/**', 'crates/thaw-jit/**', 'crates/thaw-js/**', 'crates/thaw-parser/**', 'crates/thaw-quickjs/**', 'crates/thaw-intl/**', 'crates/thaw-napi/**') }}
          restore-keys: |
            thaw-runtime-${{ runner.os }}-
      - name: Restore LLVM 22 cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-22
          key: llvm-22.1.8-Linux-X64-df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
      - name: Install LLVM 22
        env:
          LLVM_ASSET: LLVM-22.1.8-Linux-X64.tar.xz
          LLVM_SHA256: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
        run: |
          prefix="$HOME/llvm-22"
          if [[ ! -x "$prefix/bin/llvm-config" ]]; then
            # Extract into a scratch directory and move it into place, so an
            # interrupted download or extraction never leaves a partial tree
            # that the cache would then save.
            work=$(mktemp -d "$HOME/llvm-install.XXXXXX")
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 600 \
              -o "$work/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET"
            echo "$LLVM_SHA256  $work/llvm.tar.xz" | sha256sum -c -
            mkdir "$work/extract"
            tar -xJf "$work/llvm.tar.xz" -C "$work/extract" --strip-components=1
            rm -f "$work/llvm.tar.xz"
            rm -rf "$prefix"
            mv "$work/extract" "$prefix"
            rm -rf "$work"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
      - name: Build the thaw CLI
        run: cargo build -p thaw-cli
      - name: Generate the matrix (independent chunk programs, their node twins, the expected probe names)
        run: |
          W="$RUNNER_TEMP/parity-routed"
          mkdir -p "$W/bin"
          # 10 probes per program: a compile error only hides its own chunk (see gen_routed.py).
          python3 tools/parity/gen_routed.py "$W" --chunk 10 | tee "$W/gen.log"
      - name: Compile each chunk with thaw-js (route-all, wire trace) and with quickjs
        env:
          THAW_JS_ROUTE_ALL: "1"
          THAW_JS_TRACE_WIRE: "1"
        run: |
          W="$RUNNER_TEMP/parity-routed"
          # A compile failure is a finding, not a harness error: record it per program and keep going.
          for f in "$W"/matrix_c*.ts; do
            base=$(basename "$f" .ts)
            rc=0
            target/debug/thaw build "$f" -o "$W/bin/$base" > "$W/$base.build.log" 2>&1 || rc=$?
            echo "$rc" > "$W/$base.build.rc"
            echo "$base: thaw build exit $rc"
            # which engine the binary links: count of QuickJS JS_NewRuntime symbols (0 = none, or a stripped binary)
            [ -x "$W/bin/$base" ] && echo "$base thaw-js binary JS_NewRuntime=$(nm "$W/bin/$base" 2>/dev/null | grep -c ' JS_NewRuntime$')" >> "$W/engines.txt"
            if [ "$rc" != 0 ]; then
              {
                echo "### $base: thaw build failed (exit $rc), first 40 lines of build.log"
                echo '```'
                head -n 40 "$W/$base.build.log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # Second engine, same chunks: THAW_JS_ENGINE=quickjs is the explicit opt-out. With it,
          # thaw_js_routing_enabled() is false, so THAW_JS_ROUTE_ALL is ignored: the binary links QuickJS.
          # Built with the env unset otherwise (no ROUTE_ALL, no wire trace). Failure is recorded, not fatal.
          mkdir -p "$W/bin_qjs"
          for f in "$W"/matrix_c*.ts; do
            base=$(basename "$f" .ts)
            rc=0
            THAW_JS_ENGINE=quickjs target/debug/thaw build "$f" -o "$W/bin_qjs/$base" > "$W/$base.qjs.build.log" 2>&1 || rc=$?
            echo "$rc" > "$W/$base.qjs.build.rc"
            echo "$base: thaw build (quickjs) exit $rc"
            [ -x "$W/bin_qjs/$base" ] && echo "$base quickjs binary JS_NewRuntime=$(nm "$W/bin_qjs/$base" 2>/dev/null | grep -c ' JS_NewRuntime$')" >> "$W/engines.txt"
          done
          exit 0
      - name: Run each chunk with thaw and node, then diff
        env:
          THAW_JS_ROUTE_ALL: "1"
          THAW_JS_TRACE_WIRE: "1"
        run: |
          W="$RUNNER_TEMP/parity-routed"
          for f in "$W"/matrix_c*.ts; do
            base=$(basename "$f" .ts)
            rc=missing
            : > "$W/$base.thaw.stdout"; : > "$W/$base.thaw.stderr"
            if [ -x "$W/bin/$base" ]; then
              rc=0
              timeout 120 "$W/bin/$base" > "$W/$base.thaw.stdout" 2> "$W/$base.thaw.stderr" || rc=$?
            fi
            echo "$rc" > "$W/$base.run.rc"
            echo "$base: thaw run exit $rc"
            # node is the oracle; its exit code is recorded, not fatal
            node "$W/$base.node.js" > "$W/$base.node.stdout" 2> "$W/$base.node.stderr" || echo "node exit $?" >> "$W/$base.node.stderr"
            # QuickJS binary, run without the thaw-js env (env -u drops the step-level ROUTE_ALL/TRACE_WIRE)
            qrc=missing
            : > "$W/$base.qjs.stdout"; : > "$W/$base.qjs.stderr"
            if [ -x "$W/bin_qjs/$base" ]; then
              qrc=0
              env -u THAW_JS_ROUTE_ALL -u THAW_JS_TRACE_WIRE timeout 120 "$W/bin_qjs/$base" > "$W/$base.qjs.stdout" 2> "$W/$base.qjs.stderr" || qrc=$?
            fi
            echo "$qrc" > "$W/$base.qjs.run.rc"
            echo "$base: quickjs run exit $qrc"
          done
          # Concatenate in chunk order: a missing program contributes no lines, so only its probes become MISSING.
          mkdir -p "$W/diff/node" "$W/diff/thaw" "$W/diff/qjs"
          : > "$W/diff/node/matrix.txt"; : > "$W/diff/thaw/matrix.txt"; : > "$W/diff/qjs/matrix.txt"
          for f in "$W"/matrix_c*.ts; do
            base=$(basename "$f" .ts)
            cat "$W/$base.node.stdout" >> "$W/diff/node/matrix.txt"
            cat "$W/$base.thaw.stdout" >> "$W/diff/thaw/matrix.txt"
            cat "$W/$base.qjs.stdout" >> "$W/diff/qjs/matrix.txt"
          done
          # diff.py --blocks compares node/<corpus>.txt with thaw/<corpus>.txt by `@@ <name>` blocks (probe values may span
          # lines); no baseline, so every gap is reported (exit 1 is expected).
          python3 tools/parity/diff.py --blocks --node-dir "$W/diff/node" --thaw-dir "$W/diff/thaw" \
            --gaps "$W/gaps.json" > "$W/diff.txt" 2>&1 || echo "diff.py exit $?" >> "$W/diff.txt"
          tail -n 3 "$W/diff.txt" || true
          # Same node oracle against the QuickJS outputs. diff.py's --thaw-dir is just the second engine's dir here.
          mkdir -p "$W/diff"
          python3 tools/parity/diff.py --blocks --node-dir "$W/diff/node" --thaw-dir "$W/diff/qjs" \
            --gaps "$W/gaps_qjs.json" > "$W/diff_qjs.txt" 2>&1 || echo "diff.py (quickjs) exit $?" >> "$W/diff_qjs.txt"
          tail -n 3 "$W/diff_qjs.txt" || true
      - name: Three-way comparison (node vs quickjs vs thaw-js, non-gating)
        if: always()
        run: |
          W="$RUNNER_TEMP/parity-routed"
          python3 tools/parity/threeway.py --node "$W/diff/node/matrix.txt" --qjs "$W/diff/qjs/matrix.txt" \
            --thaw "$W/diff/thaw/matrix.txt" --out "$W/threeway.txt" > "$W/threeway.summary.txt" 2>&1 \
            || echo "threeway.py exit $?" >> "$W/threeway.summary.txt"
          cat "$W/threeway.summary.txt"
      - name: Summarise the routed parity matrix
        if: always()
        run: |
          W="$RUNNER_TEMP/parity-routed"
          {
            echo "## parity routed matrix (thaw-js route-all and quickjs vs node, NON-GATING)"
            echo
            echo "- probes expected: $(wc -l < "$W/probes.txt" 2>/dev/null || echo unknown) in $(ls "$W"/matrix_c*.ts 2>/dev/null | wc -l) programs"
            if [ -s "$W/gaps.json" ]; then
              echo "- thaw-js gaps vs node: $(jq '.gaps | length' "$W/gaps.json")"
            else
              echo "- no gaps.json produced; see the build and run logs in the artifact"
            fi
            if [ -s "$W/gaps_qjs.json" ]; then
              echo "- quickjs gaps vs node: $(jq '.gaps | length' "$W/gaps_qjs.json")"
            else
              echo "- no gaps_qjs.json produced"
            fi
            echo "- quickjs builds failed: $(grep -lvx 0 "$W"/matrix_c*.qjs.build.rc 2>/dev/null | wc -l) of $(ls "$W"/matrix_c*.ts 2>/dev/null | wc -l)"
            echo "- linked-engine check (JS_NewRuntime symbol count per binary): $(tr '\n' ';' < "$W/engines.txt" 2>/dev/null)"
            echo
            echo "### three-way (node vs quickjs vs thaw-js)"
            echo
            echo '```text'
            cat "$W/threeway.summary.txt" 2>/dev/null || echo "no threeway output"
            echo '```'
            echo
            echo "<details><summary>three-way table (first 300 lines)</summary>"
            echo
            echo '```'
            head -n 300 "$W/threeway.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "</details>"
            echo
            echo "### failed chunks"
            echo
            if ls "$W"/matrix_c*.build.rc >/dev/null 2>&1 && grep -qvx 0 "$W"/matrix_c*.build.rc; then
              echo '```text'
              for f in "$W"/matrix_c*.ts; do
                base=$(basename "$f" .ts)
                rc=$(cat "$W/$base.build.rc" 2>/dev/null || echo unknown)
                [ "$rc" = "0" ] && continue
                echo "$base build exit $rc, build.log: $(head -n 1 "$W/$base.build.log" 2>/dev/null | cut -c1-300)"
                echo "  probes: $(tr '\n' ' ' < "$W/probes_${base#matrix_}.txt" 2>/dev/null)"
              done
              echo '```'
            else
              echo "none: every chunk compiled"
            fi
            echo
            echo "| program | probes | build exit | run exit | thaw lines | node lines |"
            echo "|---|---|---|---|---|---|"
            for f in "$W"/matrix_c*.ts; do
              base=$(basename "$f" .ts)
              n=$(wc -l < "$W/probes_${base#matrix_}.txt" 2>/dev/null || echo 0)
              echo "| $base | $n | \`$(cat "$W/$base.build.rc" 2>/dev/null || echo unknown)\` | \`$(cat "$W/$base.run.rc" 2>/dev/null || echo unknown)\` | $(wc -l < "$W/$base.thaw.stdout" 2>/dev/null || echo 0) | $(wc -l < "$W/$base.node.stdout" 2>/dev/null || echo 0) |"
            done
            echo
            if [ -s "$W/gaps.json" ]; then
              echo "| family | probes | gaps |"
              echo "|---|---|---|"
              for fam in F3 F5 F6; do
                total=$(grep -c "^$fam\." "$W/probes.txt" || true)
                gaps=$(jq --arg f "$fam" '[.gaps[] | select(.probe | startswith($f + "."))] | length' "$W/gaps.json")
                echo "| $fam | $total | $gaps |"
              done
              echo
            fi
            for f in "$W"/matrix_c*.ts; do
              base=$(basename "$f" .ts)
              if [ "$(cat "$W/$base.build.rc" 2>/dev/null)" != "0" ] && [ -s "$W/$base.build.log" ]; then
                echo "<details><summary>$base build log (first 40 lines)</summary>"
                echo
                echo '```'
                head -n 40 "$W/$base.build.log"
                echo '```'
                echo
                echo "</details>"
                echo
              fi
            done
            echo "<details><summary>diff table (first 300 lines)</summary>"
            echo
            echo '```'
            head -n 300 "$W/diff.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-routed
          path: |
            ${{ runner.temp }}/parity-routed/
            !${{ runner.temp }}/parity-routed/bin/
            !${{ runner.temp }}/parity-routed/bin_qjs/
          if-no-files-found: ignore
