[workspace]
resolver = "2"
members = ["crates/thaw-llvm", "crates/thaw-parser", "crates/thaw-hir", "crates/thaw-cli", "crates/thaw-arena", "crates/thaw-runtime", "crates/thaw-std", "crates/thaw-inspect", "crates/thaw-bridge", "crates/thaw-napi", "crates/thaw-registry", "crates/thaw-jit", "crates/thaw-icu-data", "crates/thaw-intl", "crates/thaw-js", "crates/thaw-js-infer", "crates/thaw-rt-dylib", "crates/thaw-wasm", "crates/thaw-sqlite", "crates/thaw-node-builtins"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# Runtime archives shipped by `thaw prepare` (see `runtime_lto` in thaw-cli/src/build.rs).
[profile.thaw-rt]
inherits = "release"
lto = "fat"
codegen-units = 1

[patch.crates-io]
regress = { path = "vendor/regress" }
